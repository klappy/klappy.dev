name: Canon Quality

# Calls oddkit_audit against prod and reports/blocks based on findings.
# Spec: klappy://docs/oddkit/specs/oddkit-audit (DRAFT v2.2)
# Mode is controlled by repo variable AUDIT_ENFORCEMENT_MODE:
#   - 'soft' (default): comment with findings, never fail the job
#   - 'hard': fail the job when status != OK
# Set the variable at https://github.com/klappy/klappy.dev/settings/variables/actions
# PR-3.1 ships in soft. PR-3.2 will flip to hard after the observation cycle.

on:
  pull_request:
    branches: [main]
    paths:
      - 'writings/**'
      - 'canon/**'
      - 'journal/**'
      - 'odd/**'
      - 'docs/**'
      - '.github/workflows/canon-quality.yml'
  push:
    branches: [main]
    paths:
      - 'writings/**'
      - 'canon/**'
      - 'journal/**'
      - 'odd/**'
      - 'docs/**'
      - '.github/workflows/canon-quality.yml'
  workflow_dispatch:
    inputs:
      scope_paths:
        description: 'JSON array of scope paths (default ["writings/"])'
        required: false
        default: '["writings/"]'

permissions:
  contents: read
  pull-requests: write

env:
  ODDKIT_MCP_URL: https://oddkit.klappy.dev/mcp
  ENFORCEMENT_MODE: ${{ vars.AUDIT_ENFORCEMENT_MODE || 'soft' }}
  USER_AGENT: 'klappy.dev-canon-quality/1.0 (+github-actions; ${{ github.repository }}#${{ github.run_id }})'

jobs:
  frontmatter:
    name: Frontmatter schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Hard-block from day one. The schema is unambiguous; canon
    # (klappy://canon/constraints/frontmatter-validation-before-merge) mandates
    # this gate "No Exceptions". No soft-observation cycle — the renderer's
    # silent-drop failure mode (the May 10 incident) is exactly what this
    # prevents.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run validator
        id: validate
        run: |
          python3 scripts/validate-frontmatter.py --json writings/ > /tmp/fm-result.json || true
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/fm-result.json'))
          print(f"scanned={d['scanned']} status={d['status']} findings={len(d['findings'])}")
          PY

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontmatter-findings
          path: /tmp/fm-result.json
          retention-days: 14
          if-no-files-found: warn

      - name: Render PR comment
        id: render
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json, collections
          d = json.load(open('/tmp/fm-result.json'))
          findings = d['findings']
          scanned = d['scanned']
          lines = []
          if not findings:
              lines.append('### Canon Quality — Frontmatter Schema ✅')
              lines.append('')
              lines.append(f'All {scanned} file(s) in `writings/` conform to '
                           f'`klappy://canon/meta/frontmatter-schema`.')
          else:
              lines.append('### Canon Quality — Frontmatter Schema ❌')
              lines.append('')
              lines.append(f"**{len(findings)} violation(s)** across "
                           f"`writings/` ({scanned} files scanned). "
                           f"Mode: **hard-block** (canon mandate, no exceptions).")
              lines.append('')
              by_file = collections.defaultdict(list)
              for f in findings:
                  by_file[f['location']['path']].append(f)
              for path, items in sorted(by_file.items()):
                  lines.append(f'<details><summary><code>{path}</code> — '
                               f'{len(items)} finding(s)</summary>')
                  lines.append('')
                  lines.append('| Rule | Occurrence | Message |')
                  lines.append('|---|---|---|')
                  for it in items:
                      occ = (it['occurrence'] or '').replace('|', '\\|')
                      msg = (it['message'] or '').replace('|', '\\|')
                      lines.append(f"| `{it['rule_id']}` | `{occ}` | {msg} |")
                  lines.append('')
                  lines.append('</details>')
              lines.append('')
              lines.append('> **What to do**')
              lines.append('> - Compare the offending file against `canon/meta/frontmatter-schema.md` (the source of truth) and a known-good essay like `writings/reverse-engineer-the-future.md`.')
              lines.append('> - For enum violations: pick a value from the allowed set named in the message.')
              lines.append('> - For type mismatches: remove the surrounding quotes on booleans and integers.')
              lines.append('> - For missing essay-discovery fields: backfill `type`, `slug`, `hook`, `description` from your own opening — do not invent content.')
              lines.append('> - There is no allowlist for these violations. They cause the renderer to silently drop the page from the homepage.')
          lines.append('')
          lines.append('<sub>Validator: `scripts/validate-frontmatter.py` · Canon: `klappy://canon/constraints/frontmatter-validation-before-merge` · Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>')
          open('/tmp/fm-comment.md', 'w').write('\n'.join(lines))
          PY

      - name: Sticky comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: canon-quality-frontmatter
          path: /tmp/fm-comment.md

      - name: Workflow step summary
        if: always()
        run: |
          {
            echo "## Canon Quality — Frontmatter Schema"
            echo ""
            python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/fm-result.json'))
              n = len(d['findings'])
              if n == 0:
                  print(f"- **Status**: ✅ OK")
                  print(f"- **Files scanned**: {d['scanned']}")
              else:
                  print(f"- **Status**: ❌ FINDINGS")
                  print(f"- **Files scanned**: {d['scanned']}")
                  print(f"- **Total findings**: {n}")
                  from collections import Counter
                  by_rule = Counter(f['rule_id'] for f in d['findings'])
                  print(f"- **By rule**: `{dict(by_rule)}`")
          except Exception as e:
              print(f"- **Result**: validator did not produce output ({e})")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforcement gate (hard-block)
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/fm-result.json'))
          if d['findings']:
              print(f"::error::Frontmatter validation found {len(d['findings'])} violation(s). "
                    f"Fix the offending fields per canon/meta/frontmatter-schema.md "
                    f"or see the PR comment for per-finding guidance.")
              sys.exit(1)
          print(f"Frontmatter OK ({d['scanned']} file(s) scanned).")
          PY

  audit:
    name: Reference integrity audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve scope
        id: scope
        env:
          INPUT_SCOPE_PATHS: ${{ github.event.inputs.scope_paths }}
        run: |
          if [ -n "$INPUT_SCOPE_PATHS" ]; then
            PATHS="$INPUT_SCOPE_PATHS"
          else
            PATHS='["writings/"]'
          fi
          echo "Scope paths: $PATHS"
          echo "paths=$PATHS" >> "$GITHUB_OUTPUT"

      - name: Call oddkit_audit (with one retry on transient failure)
        id: audit
        env:
          SCOPE_PATHS: ${{ steps.scope.outputs.paths }}
        run: |
          set -uo pipefail

          # Build JSON-RPC payload. The 'input' arg is a JSON string per the action's schema.
          INNER=$(python3 -c "import json,os; print(json.dumps({'scope':{'paths':json.loads(os.environ['SCOPE_PATHS'])}}))")
          PAYLOAD=$(python3 -c "
          import json, sys
          inner = sys.argv[1]
          print(json.dumps({
            'jsonrpc': '2.0',
            'id': 1,
            'method': 'tools/call',
            'params': {'name': 'oddkit_audit', 'arguments': {'input': inner}}
          }))
          " "$INNER")
          echo "$PAYLOAD" > /tmp/req.json

          AUDIT_OK=false
          HTTP_CODE=000
          for attempt in 1 2; do
            # `|| true` guards against curl exit codes (DNS, connection refused,
            # TLS errors, --max-time timeout) tripping bash -e via the command
            # substitution and aborting the retry loop. `-w '%{http_code}'` still
            # emits "000" on transport failure, which the loop already handles.
            HTTP_CODE=$(curl -sS -o /tmp/resp.raw -w '%{http_code}' \
              -X POST \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H "User-Agent: $USER_AGENT" \
              --max-time 120 \
              -d @/tmp/req.json \
              "$ODDKIT_MCP_URL" || true)
            echo "Attempt $attempt -> HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              AUDIT_OK=true
              break
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "Transient failure; sleeping 8s before retry"
              sleep 8
            fi
          done

          if [ "$AUDIT_OK" != "true" ]; then
            echo "Audit could not be completed after 2 attempts."
            echo "Response (first 500 bytes):"
            head -c 500 /tmp/resp.raw || true
            echo ""
            echo "audit_failed=true" >> "$GITHUB_OUTPUT"
            echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
            exit 0   # don't fail the step; the report step will surface this
          fi

          # Parse the SSE response. The MCP server returns event-stream with a final
          # 'data: { ... }' line containing the JSON-RPC envelope.
          # Guard with `if !` so any parse failure (sys.exit / unhandled exception)
          # is routed through the same audit_failed=true path used for HTTP failures,
          # rather than aborting the step under bash -e and skipping the comment steps.
          if ! python3 - <<'PY'
          import json, sys
          with open('/tmp/resp.raw') as f:
              raw = f.read()
          data_lines = [l[6:] for l in raw.splitlines() if l.startswith('data: ')]
          if not data_lines:
              sys.stderr.write("No SSE 'data: ' lines in response\n")
              sys.stderr.write(raw[:500])
              sys.exit(1)
          envelope = json.loads(data_lines[-1])
          if 'error' in envelope:
              sys.stderr.write(f"JSON-RPC error: {envelope['error']}\n")
              sys.exit(1)
          # Extract the action envelope from content[0].text
          content = envelope.get('result', {}).get('content', [])
          texts = [c.get('text','') for c in content if c.get('type') == 'text']
          if not texts:
              sys.stderr.write("No text content in tool-call result\n")
              sys.exit(1)
          inner = json.loads(texts[0])
          with open('/tmp/audit-result.json','w') as f:
              json.dump(inner, f, indent=2)
          # Surface a tiny diagnostic to logs
          r = inner.get('result', {})
          print(f"status={r.get('status')} findings={r.get('summary',{}).get('total_findings',0)} files={r.get('summary',{}).get('files_scanned',0)}")
          PY
          then
            echo "Failed to parse audit response."
            echo "Response (first 500 bytes):"
            head -c 500 /tmp/resp.raw || true
            echo ""
            echo "audit_failed=true" >> "$GITHUB_OUTPUT"
            echo "http_code=parse_error" >> "$GITHUB_OUTPUT"
            exit 0   # don't fail the step; the report step will surface this
          fi

          echo "audit_failed=false" >> "$GITHUB_OUTPUT"

      - name: Upload audit response artifact
        if: always() && steps.audit.outputs.audit_failed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: audit-response
          path: /tmp/audit-result.json
          retention-days: 14
          if-no-files-found: warn

      - name: Render comment body
        id: render
        if: github.event_name == 'pull_request' && steps.audit.outputs.audit_failed != 'true'
        env:
          MODE: ${{ env.ENFORCEMENT_MODE }}
        run: |
          python3 - <<'PY'
          import json, os

          with open('/tmp/audit-result.json') as f:
              d = json.load(f)
          r = d.get('result', {})
          status = r.get('status', '?')
          summary = r.get('summary', {})
          findings = r.get('findings', [])
          suppressed = r.get('suppressed_findings', [])
          scope = r.get('scope', {})
          mode = os.environ.get('MODE', 'soft')
          paths_label = ', '.join(scope.get('paths', []))

          lines = []
          if status == 'OK':
              lines.append('### Canon Quality — `oddkit_audit` ✅')
              lines.append('')
              lines.append(f'No dead `klappy://` references or legacy link patterns found in `{paths_label}`. {summary.get("files_scanned", 0)} files scanned.')
          else:
              icon = '⚠️' if mode == 'soft' else '❌'
              lines.append(f'### Canon Quality — `oddkit_audit` {icon}')
              lines.append('')
              total = summary.get('total_findings', len(findings))
              lines.append(f'**{total} finding(s)** in `{paths_label}` ({summary.get("files_scanned", 0)} files scanned). Mode: `{mode}`.')
              lines.append('')

              # Group by file, cap at 50 rendered to keep PR comment manageable
              CAP = 50
              by_file = {}
              for f in findings[:CAP]:
                  loc = f.get('location', {})
                  by_file.setdefault(loc.get('path', '?'), []).append(
                      (loc.get('line'), f.get('rule_id'), f.get('occurrence'), f.get('message'))
                  )

              for path, items in sorted(by_file.items()):
                  lines.append(f'<details><summary><code>{path}</code> — {len(items)} finding(s)</summary>')
                  lines.append('')
                  lines.append('| Line | Rule | Occurrence | Message |')
                  lines.append('|---:|---|---|---|')
                  for line, rule, occ, msg in items:
                      occ_safe = (occ or '').replace('|', '\\|')
                      msg_safe = (msg or '').replace('|', '\\|')
                      lines.append(f'| {line} | `{rule}` | `{occ_safe}` | {msg_safe} |')
                  lines.append('')
                  lines.append('</details>')

              if len(findings) > CAP:
                  lines.append('')
                  lines.append(f'_… and {len(findings) - CAP} more finding(s). See the `audit-response` workflow artifact for the full list._')

              if suppressed:
                  s_count = len(suppressed) if isinstance(suppressed, list) else suppressed
                  lines.append('')
                  lines.append(f'_{s_count} finding(s) suppressed via `<!-- audit-allow: ... -->` directives._')

              lines.append('')
              if mode == 'soft':
                  lines.append('> **Soft-block mode** — this status is informational; the job will not fail. Hard-block ships in PR-3.2 after the observation cycle.')
                  lines.append('>')
                  lines.append('> **What to do for each finding:**')
                  lines.append('> - **Fix the slug** if the target now lives at a different `klappy://` URI.')
                  lines.append('> - **Remove the link** if it is no longer needed.')
                  lines.append('> - **Allowlist with a reason** if the rot is intentional (e.g. forward-ref to an upcoming article): place `<!-- audit-allow: dead-reference reason="..." -->` on the line above the offending link. The directive is line-level and scopes to the next markdown link.')
              else:
                  lines.append('> **Hard-block mode** — this PR will fail until findings are resolved. Fix the dead references, remove the links, or add a line-level allowlist directive (`<!-- audit-allow: dead-reference reason="..." -->`) above the offending link.')

          lines.append('')
          lines.append('<sub>Spec: `klappy://docs/oddkit/specs/oddkit-audit` · Workflow: `.github/workflows/canon-quality.yml` · Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>')

          with open('/tmp/comment.md', 'w') as f:
              f.write('\n'.join(lines))
          PY

      - name: Sticky comment — audit results
        if: github.event_name == 'pull_request' && steps.audit.outputs.audit_failed != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: canon-quality-audit
          path: /tmp/comment.md

      - name: Sticky comment — audit infrastructure failure
        if: github.event_name == 'pull_request' && steps.audit.outputs.audit_failed == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: canon-quality-audit
          message: |
            ### Canon Quality — `oddkit_audit` ⚠️ (infrastructure)

            The audit could not be completed (HTTP `${{ steps.audit.outputs.http_code }}` from `${{ env.ODDKIT_MCP_URL }}` after retry). This run produces no signal about reference integrity — re-run the workflow if the failure was transient.

            The job does not fail on infrastructure issues; persistent failures should be tracked separately.

            <sub>Workflow: `.github/workflows/canon-quality.yml` · Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>

      - name: Workflow step summary
        if: always()
        run: |
          {
            echo "## Canon Quality — \`oddkit_audit\`"
            echo ""
            echo "- **Mode**: \`$ENFORCEMENT_MODE\`"
            echo "- **Endpoint**: \`$ODDKIT_MCP_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.audit.outputs.audit_failed }}" = "true" ]; then
            echo "- **Result**: infrastructure failure (HTTP \`${{ steps.audit.outputs.http_code }}\`)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f /tmp/audit-result.json ]; then
            python3 - <<'PY'
          import json, os
          with open('/tmp/audit-result.json') as f:
              d = json.load(f)
          r = d.get('result', {})
          s = r.get('summary', {})
          out_path = os.environ['GITHUB_STEP_SUMMARY']
          with open(out_path, 'a') as f:
              f.write(f"- **Status**: `{r.get('status')}`\n")
              f.write(f"- **Total findings**: {s.get('total_findings', 0)}\n")
              f.write(f"- **By severity**: `{s.get('by_severity', {})}`\n")
              f.write(f"- **Files scanned**: {s.get('files_scanned', 0)}\n")
              f.write(f"- **Scope**: `{r.get('scope', {})}`\n")
              if s.get('truncated'):
                  f.write(f"- **Truncated**: yes (response was capped)\n")
          PY
          else
            echo "- **Result**: no audit result file produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforcement gate
        if: steps.audit.outputs.audit_failed != 'true'
        run: |
          STATUS=$(python3 -c "import json; print(json.load(open('/tmp/audit-result.json'))['result']['status'])")
          echo "Enforcement mode: $ENFORCEMENT_MODE | Audit status: $STATUS"
          if [ "$ENFORCEMENT_MODE" = "hard" ] && [ "$STATUS" != "OK" ]; then
            echo "::error::Hard-block mode: oddkit_audit returned status=$STATUS. Failing job — fix the dead references or add explicit allowlist directives."
            exit 1
          fi
          echo "Not failing the job (mode=$ENFORCEMENT_MODE, status=$STATUS)."

  retrieval-readiness:
    name: P0010 retrieval-readiness (soft)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Soft-only report for the P0010 retrieval disclosure contract precursor.
    # Pure-Python file parsing (no oddkit_audit call) — deterministic, so not
    # subject to oddkit/oddkit#149 audit non-determinism. Reports corpus
    # readiness for structural filters + kind resolution; never fails the job
    # until the corpus is cleaned and the contract is ready to enforce.
    # Spec: klappy://canon/constraints/retrieval-disclosure-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run retrieval-readiness audit
        run: |
          python3 scripts/audit-retrieval-readiness.py --json > /tmp/rr-result.json || true
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/rr-result.json'))
          s = d['summary']
          print(f"scanned={d['scanned']} status={d['status']} "
                f"blocking={s['blocking']} warning={s['warning']} info={s['informational']}")
          print(f"kinds={s['kind_distribution']}")
          PY

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-readiness-findings
          path: /tmp/rr-result.json
          retention-days: 14
          if-no-files-found: warn

      - name: Render PR comment
        id: render
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/rr-result.json'))
          s = d['summary']
          lines = []
          icon = '✅' if s['blocking'] == 0 else '⚠️'
          lines.append(f"### Canon Quality — P0010 Retrieval-Readiness {icon}")
          lines.append('')
          lines.append(f"Soft report for `klappy://canon/constraints/retrieval-disclosure-contract`. "
                       f"{d['scanned']} files scanned. **Never blocks** — informational until the corpus is ready to enforce.")
          lines.append('')
          lines.append(f"- **Blocking-class findings**: {s['blocking']} (structural fields the contract would filter on)")
          lines.append(f"- **Warnings**: {s['warning']} (kind resolves to `unknown`)")
          lines.append(f"- **Informational**: {s['informational']} (exempt templates/archive/drafts)")
          lines.append('')
          lines.append(f"**Kind distribution**: `{s['kind_distribution']}`")
          lines.append(f"**Kind source**: `{s['kind_source_distribution']}` (frontmatter-primary, path-secondary)")
          lines.append(f"**Default-include visibility**: {s['default_include_visible']} visible, "
                       f"{s['default_include_hidden']} hidden (journals/apocrypha/unknown)")
          lines.append('')
          lines.append(f"**By rule**: `{s['by_rule']}`")
          lines.append('')
          lines.append('> These are not schema violations (see the Frontmatter Schema job for those on `writings/`). '
                       'They are corpus-readiness signals for the retrieval contract: invalid/missing `audience`, '
                       '`exposure`, `tier`, and docs whose `kind` cannot be resolved. Fix in a corpus-cleanup PR before '
                       'the contract flips to enforcing. See the `retrieval-readiness-findings` artifact for the full list.')
          lines.append('')
          lines.append('<sub>Validator: `scripts/audit-retrieval-readiness.py` · Constraint: '
                       '`klappy://canon/constraints/retrieval-disclosure-contract` · Run: '
                       '[#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>')
          open('/tmp/rr-comment.md','w').write('\n'.join(lines))
          PY

      - name: Sticky comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: canon-quality-retrieval-readiness
          path: /tmp/rr-comment.md

      - name: Workflow step summary
        if: always()
        run: |
          {
            echo "## Canon Quality — P0010 Retrieval-Readiness (soft)"
            echo ""
            python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/rr-result.json'))
              s = d['summary']
              print(f"- **Status**: {d['status']}")
              print(f"- **Scanned**: {d['scanned']}")
              print(f"- **Blocking-class**: {s['blocking']}")
              print(f"- **Warnings**: {s['warning']}")
              print(f"- **Kind distribution**: `{s['kind_distribution']}`")
          except Exception as e:
              print(f"- **Result**: audit did not produce output ({e})")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

  surfacing:
    name: Homepage surfacing report (soft)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Soft-only. Reports where each writings/ essay surfaces (homepage feed /
    # nav / hidden) and flags anything not on the homepage. The HARD field gate
    # lives in the `frontmatter` job; this job exists to make the legitimate-
    # but-easy-to-miss `exposure: nav` state LOUD instead of silent. Never fails.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run surfacing report
        run: |
          python3 scripts/surfacing-report.py --json writings/ > /tmp/surface.json || true
          python3 scripts/surfacing-report.py writings/ || true

      - name: Render PR comment
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/surface.json'))
          essays = d['essays']
          off = d['not_on_homepage']
          lines = []
          icon = '✅' if not off else 'ℹ️'
          lines.append(f"### Canon Quality — Homepage Surfacing {icon}")
          lines.append('')
          lines.append(f"{len(essays)} essay(s) scanned. **Soft report** — never blocks; "
                       f"the hard field gate is the Frontmatter Schema job.")
          lines.append('')
          if off:
              lines.append(f"**{len(off)} essay(s) are NOT on the homepage feed** "
                           f"(confirm this is intentional):")
              lines.append('')
              lines.append('| Essay | Surface |')
              lines.append('|---|---|')
              by = {e['path']: e for e in essays}
              for p in off:
                  e = by[p]
                  lines.append(f"| `{p}` | {e['surface']} — {e['explanation']} |")
              lines.append('')
              lines.append('> To promote to the homepage: set `public: true` and `exposure: public`.')
          else:
              lines.append('All published essays resolve to the homepage feed.')
          lines.append('')
          lines.append('<sub>Report: `scripts/surfacing-report.py` · Canon: '
                       '`klappy://canon/constraints/frontmatter-validation-before-merge`</sub>')
          open('/tmp/surface-comment.md', 'w').write('\n'.join(lines))
          PY

      - name: Sticky comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: canon-quality-surfacing
          path: /tmp/surface-comment.md

  preflight-declaration:
    name: Preflight declaration on flight artifacts (soft)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Soft-only report for the START-gate half of the flight airframe
    # (klappy://canon/constraints/preflight-checklist-takeoff-gate). Pure-Python
    # file parsing — deterministic, no oddkit call. Checks that any file which
    # self-identifies as a flight artifact (marker `<!-- flight-artifact -->`)
    # carries a well-formed preflight declaration: all five items + a
    # disposition. This is the MECHANICAL half only (audit-gates-are-spawned-
    # agent-sessions permits a pattern matcher for literal presence checks);
    # whether the declared preflight was TRUE is a spawned-agent judgment, never
    # this job. Ships soft; flips to hard after an observation cycle, same as the
    # frontmatter and audit gates. The END-gate counterpart is recording-as-landing.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run preflight-declaration check
        run: |
          python3 scripts/validate-preflight-declaration.py --json > /tmp/pf-result.json || true
          python3 - <<'PYEOF'
          import json
          d = json.load(open('/tmp/pf-result.json'))
          print(f"scanned={d['scanned']} flight_artifacts={d['flight_artifacts']} "
                f"status={d['status']} findings={len(d['findings'])}")
          PYEOF

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-declaration-findings
          path: /tmp/pf-result.json
          retention-days: 14
          if-no-files-found: warn

      - name: Render PR comment
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PYEOF'
          import json
          d = json.load(open('/tmp/pf-result.json'))
          findings = d['findings']
          lines = []
          icon = '\u2705' if not findings else '\u26a0\ufe0f'
          lines.append(f"### Canon Quality \u2014 Preflight Declaration {icon}")
          lines.append('')
          lines.append(f"Soft report for the START gate "
                       f"(`klappy://canon/constraints/preflight-checklist-takeoff-gate`). "
                       f"{d['scanned']} file(s) scanned, {d['flight_artifacts']} flight "
                       f"artifact(s) checked. **Never blocks** \u2014 informational until the "
                       f"gate flips to hard after the observation cycle.")
          lines.append('')
          if not findings:
              lines.append('All flight artifacts carry a well-formed preflight declaration '
                           '(five items + disposition), or none are marked yet.')
          else:
              lines.append(f'**{len(findings)} finding(s)** on marked flight artifacts:')
              lines.append('')
              lines.append('| File | Rule | Message |')
              lines.append('|---|---|---|')
              for f in findings:
                  path = f['location']['path']
                  msg = (f['message'] or '').replace('|', '\\|')
                  lines.append(f"| `{path}` | `{f['rule_id']}` | {msg} |")
              lines.append('')
              lines.append('> Mechanical presence check only. A green result means a declaration '
                           'exists and is well-formed \u2014 not that the declared preflight was '
                           'true. Verifying the declaration is honest is a spawned-agent judgment '
                           '(`klappy://canon/constraints/audit-gates-are-spawned-agent-sessions`).')
          lines.append('')
          lines.append('<sub>Validator: `scripts/validate-preflight-declaration.py` \u00b7 '
                       'Constraint: `klappy://canon/constraints/preflight-checklist-takeoff-gate` \u00b7 '
                       'Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>')
          open('/tmp/pf-comment.md','w').write('\n'.join(lines))
          PYEOF

      - name: Sticky comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: canon-quality-preflight-declaration
          path: /tmp/pf-comment.md

      - name: Workflow step summary
        if: always()
        run: |
          {
            echo "## Canon Quality \u2014 Preflight Declaration (soft)"
            echo ""
            python3 - <<'PYEOF'
          import json
          try:
              d = json.load(open('/tmp/pf-result.json'))
              print(f"- **Status**: {d['status']}")
              print(f"- **Scanned**: {d['scanned']}")
              print(f"- **Flight artifacts checked**: {d['flight_artifacts']}")
              print(f"- **Findings**: {len(d['findings'])}")
          except Exception as e:
              print(f"- **Result**: check did not produce output ({e})")
          PYEOF
          } >> "$GITHUB_STEP_SUMMARY"
